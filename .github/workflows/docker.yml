name: docker-构建和提交docker

on:
  workflow_dispatch:
  push:
    paths: 
      - "docker/**"
      - "common/open-sshd-passwd.sh"
      - "common/timezone-set.sh"
      - ".github/workflows/docker.yml"
      - "!**.md"
# schedule: 
#   - cron: '0 2 2 * *' # Weekly on Sundays at 02:00 

env:
  # 多架构构建目标：linux/arm64/v8 等 arm 宿主机 pull 时会自动选择原生 arm64 镜像，
  # 不再出现 "requested image's platform (linux/amd64) does not match the detected host platform"
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  
  setup-build-publish:
    runs-on: ubuntu-latest
    name: 构建和推送docker镜像
    steps:
    
    - name: Checkout
      # 使用action库  actions/checkout获取源码
      uses: actions/checkout@v2.3.2


# ##########  多架构构建支持（buildx + QEMU）  ###########################
# 说明：
#   1. build-push-action v1/v3 走的是 docker build，不支持多平台，必须升级到 v5+ 并前置 setup-buildx
#   2. arm64 构建在 amd64 runner 上通过 QEMU 模拟执行，比原生慢，配合 gha 缓存可显著加速
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3


# ##########  v3版本  ###########################
    - name: 登录 Docker Hub
      uses: docker/login-action@v2
      with:
        username: adockero
        password: ${{ secrets.PASSWORD }}


# ############## dind-http-shell ########################

    - name: docker:dind-http-shell
      uses: docker/build-push-action@v6
      with:
        # Comma-delimited list of tags. These will be added to the registry/repository to form the image's tags
        tags: adockero/docker:dind-http-shell
        context: ./docker/http_shell/
        file: ./docker/http_shell/Dockerfile
        platforms: ${{ env.PLATFORMS }}
        # Always attempt to pull a newer version of the image
        pull: true
        push: true
        # 构建参数
        # build-args: |
        #   APT_ARGS=docker.io
        # Adds labels with git repository information to the built image
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=dind-http-shell
        cache-to: type=gha,mode=max,scope=dind-http-shell

        
# ############## ubuntu - start  ########################
# 注意：dind-sshd-ubuntu 的 FROM 是 adockero/docker:ubuntu-ssh，
#       所以 ubuntu / ubuntu-ssh 必须先以多架构 manifest 推送完成

    - name: docker-ubuntu
      uses: docker/build-push-action@v6
      with:
        # Comma-delimited list of tags. These will be added to the registry/repository to form the image's tags
        tags: adockero/docker:ubuntu,adockero/docker-ubuntu:latest
        context: .
        file: docker/Dockerfile.ubuntu
        platforms: ${{ env.PLATFORMS }}
        # Always attempt to pull a newer version of the image
        pull: true
        push: true
        # 构建参数
        build-args: |
          APT_ARGS=docker.io
        # Adds labels with git repository information to the built image
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=docker-ubuntu
        cache-to: type=gha,mode=max,scope=docker-ubuntu
      

    - name: docker-ubuntu-ssh
      uses: docker/build-push-action@v6
      with:
        # Comma-delimited list of tags. These will be added to the registry/repository to form the image's tags
        tags: adockero/docker:ubuntu-ssh,adockero/docker-ubuntu:ssh
        context: .
        file: docker/Dockerfile.ubuntu
        platforms: ${{ env.PLATFORMS }}
        # Always attempt to pull a newer version of the image
        pull: true
        push: true
        # 构建参数
        build-args: |
          APT_ARGS=docker.io ssh
        # Adds labels with git repository information to the built image
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=docker-ubuntu-ssh
        cache-to: type=gha,mode=max,scope=docker-ubuntu-ssh
      
                            
# ############## ubuntu - end  ########################

# ############## alpine - start  ########################
# 基础镜像 docker:dind / docker:latest 官方已提供 arm64，可直接多架构构建

    - name: adockero/docker:dind-sshd
      uses: docker/build-push-action@v6
      with:
        # Comma-delimited list of tags. These will be added to the registry/repository to form the image's tags
        tags: adockero/docker:dind-sshd
        # 留意 path 要 ./，不能指定到下层文件夹
        context: ./
        file: docker/Dockerfile.sshd
        platforms: ${{ env.PLATFORMS }}
        # Always attempt to pull a newer version of the image
        pull: true
        push: true
        # 构建参数
        build-args: |
          VERSION=dind
        # Adds labels with git repository information to the built image
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=dind-sshd
        cache-to: type=gha,mode=max,scope=dind-sshd


    - name: adockero/docker:sshd
      uses: docker/build-push-action@v6
      with:
        # Comma-delimited list of tags. These will be added to the registry/repository to form the image's tags
        tags: adockero/docker:sshd
        # 留意 path 要 ./，不能指定到下层文件夹
        context: ./
        file: docker/Dockerfile.sshd
        platforms: ${{ env.PLATFORMS }}
        # Always attempt to pull a newer version of the image
        pull: true
        push: true
        # 构建参数
        build-args: |
          VERSION=latest
        # Adds labels with git repository information to the built image
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=sshd
        cache-to: type=gha,mode=max,scope=sshd
  
# ############## alpine - end  ########################
   
# ############## dind-sshd-ubuntu ########################
# 此处依赖上面已推送的 adockero/docker:ubuntu-ssh，故必须放在 ubuntu-ssh 之后

    - name: docker-dind-sshd-ubuntu-latest
      uses: docker/build-push-action@v6
      with:
        # Comma-delimited list of tags. These will be added to the registry/repository to form the image's tags
        tags: adockero/docker:dind-sshd-ubuntu
        context: ./
        file: docker/Dockerfile.dind.sshd
        platforms: ${{ env.PLATFORMS }}
        # Always attempt to pull a newer version of the image
        pull: true
        push: true
        # 构建参数
        # build-args: |
        #   FROM_BASE=adockero/docker:dind-sshd
        # Adds labels with git repository information to the built image
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=dind-sshd-ubuntu
        cache-to: type=gha,mode=max,scope=dind-sshd-ubuntu
