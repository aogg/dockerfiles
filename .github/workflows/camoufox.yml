name: camoufox-构建和提交docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: 
      - "camoufox/**"
      - ".github/workflows/camoufox.yml"
      - "!**.md"

env:
  # 多架构构建目标：arm 宿主机 pull 时自动选择原生 arm64 镜像
  # camoufox fetch 构建期会自动按 CPU 架构下载对应 linux x86_64/arm64 浏览器资产
  PLATFORMS: linux/amd64,linux/arm64

jobs:

  # 并发构建
  setup-build-publish:
    runs-on: ubuntu-latest
    name: 构建和推送docker镜像
    steps:
    
    - name: 更新代码
      # 使用action库  actions/checkout获取源码
      uses: actions/checkout@v3

# ##########  多架构构建支持（buildx + QEMU），写法参考 .github/workflows/docker.yml  ###########
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3


    -  
      name: 登录 Docker Hub
      uses: docker/login-action@v2
      with:
        username: adockero
        password: ${{ secrets.PASSWORD }}


# ##########  构建  ###########################

    - name: 构建镜像  adockero/camoufox:novnc
      uses: docker/build-push-action@v6
      with:
        # Comma-delimited list of tags. These will be added to the registry/repository to form the image's tags
        tags: adockero/camoufox:novnc
        # Path to the Dockerfile (Default is '{path}/Dockerfile')
        context: ./camoufox/
        file: "./camoufox/Dockerfile"
        platforms: ${{ env.PLATFORMS }}
        # Always attempt to pull a newer version of the image
        pull: true
        push: true
        # 构建参数：可选固定 Camoufox 浏览器版本，如 CAMOUFOX_VERSION=official/135.0-beta.25
        # 境外 runner 直连 github.com 很快，无需设置 CAMOUFOX_ASSET_MIRROR（境内自建构建时才需要）
        # build-args: |
        #   CAMOUFOX_VERSION=
        #   CAMOUFOX_ASSET_MIRROR=https://ghfast.top
        # Adds labels with git repository information to the built image
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=camoufox-novnc
        cache-to: type=gha,mode=max,scope=camoufox-novnc
